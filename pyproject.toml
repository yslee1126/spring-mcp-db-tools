[project]
name = "mcp-spring-db-tools"
version = "0.1.0"
description = "MCP server for Spring Boot database schema inspection and query execution plan analysis"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Developer", email = "dev@example.com" }
]
keywords = ["mcp", "spring-boot", "database", "schema", "query-plan"]
license = { text = "MIT" }

dependencies = [
    "mcp>=1.0.0",
    "pyyaml>=6.0",
    "pymysql>=1.1.0",
    "psycopg2-binary>=2.9.0",
    "pymssql>=2.2.0",
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
mcp-spring-db-tools = "mcp_spring_db_tools.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_spring_db_tools"]

[tool.hatch.build.targets.sdist]
include = [
    "/mcp_spring_db_tools",
    "/tests",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"

[tool.coverage.run]
source = ["mcp_spring_db_tools"]
omit = ["tests/*"]
